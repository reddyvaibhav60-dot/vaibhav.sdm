<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyhavp_I0xoiWk7aE7PcX4S-92C8pxWcR-OsA1iClhXFfrqW3KGKG6bFYOCBuMIcFdr/exec";

/* Vendor Form */
document.getElementById("vendorRegistration")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const button = this.querySelector("button");

    button.innerText = "Submitting...";
    button.disabled = true;

    const data = {
        type:"vendor",
        businessName: document.getElementById("businessName").value,
        ownerName: document.getElementById("ownerName").value,
        mobile: document.getElementById("vendorMobile").value,
        email: document.getElementById("vendorEmail").value,
        instagram: document.getElementById("instagram").value,
        category: document.getElementById("category").value,
        stallSize: document.getElementById("stallSize").value,
        notes: document.getElementById("notes").value
    };

    try {

        await fetch(SCRIPT_URL,{
            method:"POST",
            mode:"no-cors",
            body:JSON.stringify(data)
        });

        window.location.href = "vendor-thankyou.html";

    } catch(error) {

        console.error(error);

        document.getElementById("vendorMessage").innerHTML =
        "Submission failed. Please try again.";

        button.disabled = false;
        button.innerText = "Book My Stall";
    }

});

</script>
